name: Release

# Tag pushes (v1.2.3) build both platforms and publish a GitHub release
# with the Android APK attached. workflow_dispatch runs the same builds
# without publishing, e.g. to sanity-check that iOS still compiles.
on:
  push:
    tags:
      - "v*.*.*"
    # TEMPORARY: testing the android build job directly on this branch,
    # without needing a tag push. Remove this branches: entry once
    # confirmed working — see PR discussion.
    branches:
      - claude/semitone-web-flutter-g03kvc
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    uses: ./.github/workflows/_flutter-build.yml
    with:
      platform: android
      artifact_name: app-release-apk
      # The actual filename is computed at build time (version + short sha
      # + arch — see _flutter-build.yml's "Rename Android release APK"
      # step), so this is a glob rather than a fixed name.
      artifact_path: build/app/outputs/flutter-apk/*.apk
    secrets:
      android_keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      android_keystore_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      android_key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
      android_key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}

  # Currently just a build-health check — nothing is signed or published
  # for iOS yet. Once App Store distribution is set up, this can grow
  # its own signing step (mirroring Android's above) and a publish job
  # that uploads to TestFlight/App Store Connect instead of skipping it.
  ios:
    uses: ./.github/workflows/_flutter-build.yml
    with:
      platform: ios
      artifact_name: Runner.app
      artifact_path: build/ios/iphoneos/Runner.app

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: app-release-apk
          path: dist

      # A prerelease tag looks like v1.2.3-rc4; anything else (v1.2.3) is a
      # full release. GitHub Actions expressions have no native pattern
      # matching beyond contains/startsWith/endsWith, so this uses a bash
      # regex instead.
      - name: Determine prerelease status
        id: prerelease
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
