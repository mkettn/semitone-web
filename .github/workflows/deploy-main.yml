name: Deploy Main

on:
  push:
    branches: [main]

# Only the latest push to main matters; a stale in-flight deploy can be
# dropped in favor of a newer one.
concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PREVIEW_BASE_URL: ${{ vars.PREVIEW_BASE_URL }}
      REMOTE_BASE_PATH: ${{ vars.REMOTE_BASE_PATH }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Deploys to the *root* of REMOTE_BASE_PATH, the same host and base
      # path that PR previews live under (as REMOTE_BASE_PATH/pr-<N>/) —
      # see the exclude in the deploy step below for how the two coexist.
      - name: Compute base href
        id: site
        run: |
          if [ -z "$PREVIEW_BASE_URL" ]; then
            echo "::error::vars.PREVIEW_BASE_URL is not set." >&2
            exit 1
          fi
          echo "url=${PREVIEW_BASE_URL%/}/" >> "$GITHUB_OUTPUT"

          # --base-href must be an absolute *path* ("/…/", not a full URL) —
          # flutter build web rejects anything not starting and ending with
          # "/". Derive it from PREVIEW_BASE_URL's own path component (e.g.
          # "/club_office/"), which is just "/" when PREVIEW_BASE_URL is a
          # bare domain — same derivation pr-preview.yml uses, minus the
          # "pr-<N>/" suffix since main deploys to the site root.
          no_scheme="${PREVIEW_BASE_URL#*://}"
          if [[ "$no_scheme" == */* ]]; then
            base_path="/${no_scheme#*/}"
          else
            base_path="/"
          fi
          BASE_HREF="${base_path%/}/"
          echo "base_href=${BASE_HREF}" >> "$GITHUB_OUTPUT"

      - name: Build web
        run: |
          flutter build web --release \
            --base-href "${{ steps.site.outputs.base_href }}"

      - name: Install lftp
        run: scripts/setup-sftp.sh

      - name: Configure SFTP auth
        id: ssh_auth
        run: scripts/config-sftp.sh

      - name: Deploy to server via SFTP
        # Belt-and-suspenders alongside BatchMode/ConnectTimeout in
        # config-sftp.sh: fail within minutes instead of eating the whole
        # job's multi-hour cap if something still manages to hang.
        timeout-minutes: 5
        env:
          CONNECT_PROGRAM: ${{ steps.ssh_auth.outputs.connect_program }}
          PORT: ${{ steps.ssh_auth.outputs.port }}
        run: |
          # The exclude regex protects PR preview subfolders (REMOTE_DIR/
          # pr-<N>/, deployed by pr-preview.yml) from both the upload and
          # the --delete pass. Without it, mirroring the site root with
          # --delete would treat every pr-<N>/ directory as "not in the
          # local build output" and wipe out every live preview on each
          # push to main.
          REMOTE_DIR="${REMOTE_BASE_PATH%/}"
          scripts/upload.sh build/web "$REMOTE_DIR" '^pr-[0-9]+/'

      - name: Record deploy summary
        run: |
          {
            echo "### 🚀 Deployed to production"
            echo ""
            echo "${{ steps.site.outputs.url }}"
            echo ""
            echo "Deployed from ${{ github.sha }}."
          } >> "$GITHUB_STEP_SUMMARY"
