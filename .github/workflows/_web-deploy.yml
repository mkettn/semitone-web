name: _ Web deploy

on:
  workflow_call:
    inputs:
      action:
        description: sync (build + mirror upload) or delete (remove remote_dir)
        type: string
        default: sync
      pr_number:
        description: Set to deploy/clean up a PR preview subfolder instead of the site root
        type: string
        default: ""
    secrets:
      ssh_host:
        required: true
      ssh_port:
        required: false
      ssh_username:
        required: true
      ssh_private_key:
        required: false
      ssh_password:
        required: false
    outputs:
      url:
        value: ${{ jobs.compute.outputs.url }}

jobs:
  # A job that receives secrets has *all* of its outputs silently dropped
  # by GitHub's secret-masking guard ("Skip output '<name>' since it may
  # contain secret"), even outputs with nothing to do with those secrets —
  # url ended up empty in PR comments/summaries for exactly that reason
  # when this used to live in the deploy job below. Keeping compute
  # secrets-free is what lets url actually reach callers.
  compute:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.compute.outputs.url }}
      base_href: ${{ steps.compute.outputs.base_href }}
      remote_dir: ${{ steps.compute.outputs.remote_dir }}
      exclude_regex: ${{ steps.compute.outputs.exclude_regex }}
    steps:
      # PREVIEW_BASE_URL is the public site (e.g. https://previews.example.com),
      # never SSH_HOST — the two may point at completely different hostnames.
      # With pr_number set, everything targets .../pr-<N>/ instead of the
      # site root; a root sync also gets an exclude_regex so it never wipes
      # the pr-<N>/ subfolders a PR preview deploy owns.
      - name: Compute deploy paths
        id: compute
        env:
          PREVIEW_BASE_URL: ${{ vars.PREVIEW_BASE_URL }}
          REMOTE_BASE_PATH: ${{ vars.REMOTE_BASE_PATH }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [ -z "$PREVIEW_BASE_URL" ]; then
            echo "::error::vars.PREVIEW_BASE_URL is not set." >&2
            exit 1
          fi

          SUBDIR=""
          if [ -n "$PR_NUMBER" ]; then
            SUBDIR="pr-${PR_NUMBER}"
          fi

          if [ -n "$SUBDIR" ]; then
            echo "url=${PREVIEW_BASE_URL%/}/${SUBDIR}/" >> "$GITHUB_OUTPUT"
            echo "remote_dir=${REMOTE_BASE_PATH%/}/${SUBDIR}" >> "$GITHUB_OUTPUT"
            echo "exclude_regex=" >> "$GITHUB_OUTPUT"
          else
            echo "url=${PREVIEW_BASE_URL%/}/" >> "$GITHUB_OUTPUT"
            echo "remote_dir=${REMOTE_BASE_PATH%/}" >> "$GITHUB_OUTPUT"
            echo "exclude_regex=^pr-[0-9]+/" >> "$GITHUB_OUTPUT"
          fi

          # --base-href must be an absolute *path* ("/…/", not a full URL) —
          # flutter build web rejects anything not starting and ending with
          # "/". Derive it from PREVIEW_BASE_URL's own path component (e.g.
          # "/club_office/"), which is just "/" when PREVIEW_BASE_URL is a
          # bare domain.
          no_scheme="${PREVIEW_BASE_URL#*://}"
          if [[ "$no_scheme" == */* ]]; then
            base_path="/${no_scheme#*/}"
          else
            base_path="/"
          fi
          if [ -n "$SUBDIR" ]; then
            echo "base_href=${base_path%/}/${SUBDIR}/" >> "$GITHUB_OUTPUT"
          else
            echo "base_href=${base_path%/}/" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: compute
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: inputs.action == 'sync'
        uses: actions/checkout@v7

      - name: Set up Flutter
        if: inputs.action == 'sync'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: inputs.action == 'sync'
        run: flutter pub get

      # --wasm compiles *both* dart2wasm and dart2js and ships them side by
      # side; flutter_bootstrap.js picks at load time by validating a tiny
      # module containing a WasmGC struct type, falling back to the JS build
      # where that fails. It also switches the renderer — wasm builds use
      # skwasm, the JS fallback stays on CanvasKit — which is where most of
      # the saving comes from: skwasm is roughly 600 KB smaller gzipped than
      # the CanvasKit variant it replaces.
      #
      # Cross-origin isolation is *not* required. Without COOP/COEP the
      # loader sets skwasmSingleThreaded and carries on, so this works on a
      # plain static host that can't set response headers.
      #
      # --web-define substitutes {{CANVASKIT_BASE_URL}} in
      # web/flutter_bootstrap.js, which is how the engine renderer gets
      # served from our own host instead of Google's CDN. Passed
      # unconditionally: when the repository variable is unset the value is
      # empty, the bootstrap's own guard sees that and falls back to the
      # default. Passing it always also keeps Flutter from warning about an
      # unhandled template variable.
      - name: Build web
        if: inputs.action == 'sync'
        run: |
          flutter build web --release --wasm \
            --base-href "${{ needs.compute.outputs.base_href }}" \
            --web-define=CANVASKIT_BASE_URL="${{ vars.CANVASKIT_BASE_URL }}"

      # Patches build output, so it lives in a script rather than inline
      # here — see the header of that file for why it is needed and when it
      # can be deleted.
      - name: Work around the host's missing .mjs MIME type
        if: inputs.action == 'sync'
        run: scripts/patch-mjs-mime.sh build/web

      - name: Install lftp
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lftp sshpass

      # Routes lftp's sftp backend through the system ssh binary so it works
      # with plain key or password auth, and with SFTP-only (chrooted, no
      # shell/rsync) accounts.
      - name: Configure SFTP auth
        id: ssh_auth
        env:
          SSH_USERNAME: ${{ secrets.ssh_username }}
          SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          SSH_PASSWORD: ${{ secrets.ssh_password }}
        run: |
          echo "port=${{ secrets.ssh_port || '22' }}" >> "$GITHUB_OUTPUT"

          # -l $SSH_USERNAME is required here even though `open` below also
          # embeds the username in its sftp:// URL: lftp's sftp:connect-program
          # invokes this command with only host/port, never the username from
          # that URL — omitting -l silently authenticates as the local
          # runner's own OS user ("runner" on GitHub-hosted runners) instead,
          # which the remote sshd logs as "Invalid user runner" and often
          # just hangs on rather than rejecting outright.
          #
          # ConnectTimeout guards against a silent network-level hang (e.g. a
          # firewall dropping packets instead of rejecting the connection).
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            KEY_PATH="${RUNNER_TEMP}/deploy_key"
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            # BatchMode=yes: never prompt (passphrase, unknown host, etc.) —
            # fail fast with a clear error instead of hanging forever. If
            # this starts failing, the key most likely has a passphrase;
            # CI deploy keys must be passphrase-less.
            echo "connect_program=ssh -l ${SSH_USERNAME} -i ${KEY_PATH} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=15" >> "$GITHUB_OUTPUT"
          elif [ -n "$SSH_PASSWORD" ]; then
            echo "SSHPASS=${SSH_PASSWORD}" >> "$GITHUB_ENV"
            # PreferredAuthentications=password (+ disabling pubkey) forces
            # the classic "Password:" prompt sshpass actually answers —
            # without it, a server offering keyboard-interactive first can
            # leave sshpass waiting on a prompt it never recognizes.
            echo "connect_program=sshpass -e ssh -l ${SSH_USERNAME} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=15" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Set either the SSH_PRIVATE_KEY or SSH_PASSWORD secret." >&2
            exit 1
          fi

      - name: Sync to server via SFTP
        if: inputs.action == 'sync'
        # Belt-and-suspenders alongside BatchMode/ConnectTimeout above: fail
        # within minutes instead of eating the whole job's multi-hour cap if
        # something still manages to hang.
        timeout-minutes: 5
        env:
          CONNECT_PROGRAM: ${{ steps.ssh_auth.outputs.connect_program }}
          PORT: ${{ steps.ssh_auth.outputs.port }}
          SSH_HOST: ${{ secrets.ssh_host }}
          SSH_USERNAME: ${{ secrets.ssh_username }}
          REMOTE_DIR: ${{ needs.compute.outputs.remote_dir }}
        run: |
          EXCLUDE=""
          if [ -n "${{ needs.compute.outputs.exclude_regex }}" ]; then
            EXCLUDE="-x ${{ needs.compute.outputs.exclude_regex }}"
          fi
          # No quotes around $CONNECT_PROGRAM: lftp's `set` takes the rest of
          # the line as the literal value, quotes included — wrapping it in
          # "..." makes lftp try to exec a program literally named
          # `"ssh -i ... "` (with the quote characters in the filename) and
          # fail silently into an FTP-style anonymous-login hang instead of
          # ever running ssh.
          lftp -e "
          set sftp:connect-program $CONNECT_PROGRAM
          open sftp://${SSH_USERNAME}@${SSH_HOST}:${PORT}
          mkdir -p $REMOTE_DIR
          mirror -R --delete --verbose $EXCLUDE build/web $REMOTE_DIR
          bye
          "

      - name: Delete remote folder
        if: inputs.action == 'delete'
        timeout-minutes: 5
        env:
          CONNECT_PROGRAM: ${{ steps.ssh_auth.outputs.connect_program }}
          PORT: ${{ steps.ssh_auth.outputs.port }}
          SSH_HOST: ${{ secrets.ssh_host }}
          SSH_USERNAME: ${{ secrets.ssh_username }}
          REMOTE_DIR: ${{ needs.compute.outputs.remote_dir }}
        run: |
          set +e
          lftp -e "
          set sftp:connect-program $CONNECT_PROGRAM
          open sftp://${SSH_USERNAME}@${SSH_HOST}:${PORT}
          cd $REMOTE_DIR
          bye
          " >/dev/null 2>&1
          EXISTS=$?
          set -e

          if [ "$EXISTS" -ne 0 ]; then
            echo "Remote folder $REMOTE_DIR does not exist, nothing to clean up."
            exit 0
          fi

          lftp -e "
          set sftp:connect-program $CONNECT_PROGRAM
          open sftp://${SSH_USERNAME}@${SSH_HOST}:${PORT}
          rm -rf $REMOTE_DIR
          bye
          "
