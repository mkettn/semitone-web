name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel a stale in-flight deploy for this PR when a newer push arrives.
# Shares its group name with pr-preview-cleanup.yml so a close event queues
# behind an in-progress deploy instead of racing it.
concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.number }}
      PREVIEW_BASE_URL: ${{ vars.PREVIEW_BASE_URL }}
      REMOTE_BASE_PATH: ${{ vars.REMOTE_BASE_PATH }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # PREVIEW_BASE_URL is the public site (e.g. https://previews.example.com),
      # never SSH_HOST — the two may point at completely different hostnames.
      - name: Compute preview URL
        id: preview
        run: |
          if [ -z "$PREVIEW_BASE_URL" ]; then
            echo "::error::vars.PREVIEW_BASE_URL is not set." >&2
            exit 1
          fi
          PREVIEW_URL="${PREVIEW_BASE_URL%/}/pr-${PR_NUMBER}/"
          echo "url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"

          # --base-href must be an absolute *path* ("/…/", not a full URL) —
          # flutter build web rejects anything not starting and ending with
          # "/", even though the resulting <base href> tag would happily
          # accept an absolute URL. Derive it from PREVIEW_BASE_URL's own
          # path component (e.g. "/club_office/"), which is empty when
          # PREVIEW_BASE_URL is bare domain.
          no_scheme="${PREVIEW_BASE_URL#*://}"
          if [[ "$no_scheme" == */* ]]; then
            base_path="/${no_scheme#*/}"
          else
            base_path="/"
          fi
          BASE_HREF="${base_path%/}/pr-${PR_NUMBER}/"
          echo "base_href=${BASE_HREF}" >> "$GITHUB_OUTPUT"

      - name: Build web
        run: |
          flutter build web --release \
            --base-href "${{ steps.preview.outputs.base_href }}"

      - name: Install lftp
        run: scripts/setup-sftp.sh

      - name: Configure SFTP auth
        id: ssh_auth
        run: scripts/config-sftp.sh

      - name: Deploy to server via SFTP
        # Belt-and-suspenders alongside BatchMode/ConnectTimeout in
        # config-sftp.sh: fail within minutes instead of eating the whole
        # job's multi-hour cap if something still manages to hang.
        timeout-minutes: 5
        env:
          CONNECT_PROGRAM: ${{ steps.ssh_auth.outputs.connect_program }}
          PORT: ${{ steps.ssh_auth.outputs.port }}
        run: |
          REMOTE_DIR="${REMOTE_BASE_PATH%/}/pr-${PR_NUMBER}"
          scripts/upload.sh build/web "$REMOTE_DIR"

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            ### 🚀 Preview deployed

            ${{ steps.preview.outputs.url }}

            Updated from ${{ github.sha }}.
