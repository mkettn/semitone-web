<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A tuner and metronome that help you sing and hit the right notes, in any scale.">

  <!-- Open Graph / Twitter Card: link-preview metadata for chat apps and
       social platforms. Only one language is possible here — these tags
       are read by crawlers that fetch this one URL once, with no per-
       viewer negotiation (see https://ogp.me/), unlike the in-app UI
       which is fully localized. og:locale/og:locale:alternate declare
       that fact honestly rather than implying more than a static page
       can deliver; the image is the app's non-maskable icon, since the
       maskable variants are padded for OS icon masking and read as
       mostly empty space when shown unmasked. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Semitone Web">
  <meta property="og:description" content="A tuner and metronome that help you sing and hit the right notes, in any scale.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="de_DE">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Semitone Web">
  <meta name="twitter:description" content="A tuner and metronome that help you sing and hit the right notes, in any scale.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Semitone Web">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Semitone Web</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
